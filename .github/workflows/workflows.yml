name: Build Kinesis-KSU KERNEL

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    env:
      ZIPNAME: "Kinesis-Kernel-$(date '+%Y%m%d-%H%M')-sm6250.zip"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v2

      - name: 📦 Install dependencies and prepare environment
        run: |
          sudo apt update
          sudo apt install -y git bison flex libxml2 libssl-dev bc zip default-jre python3 python3-pip wget curl cpio bash ccache bc binutils-dev libelf-dev zlib1g-dev texinfo ninja-build
          # Forcefully remove the 'kernel' directory
          rm -rf kernel
          echo "kernel directory removed forcefully."
          # Forcefully remove the 'Azyr_Kernel' directory if exists
          if [ -d "Azyr_Kernel" ]; then
            echo "Azyr_Kernel directory exists. Deleting..."
            rm -rf Azyr_Kernel
            echo "Azyr_Kernel directory deleted."
          fi

      - name: 💽 Cache ccache
        uses: actions/cache@v2
        with:
          path: /tmp/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 🚧 Build kernel
        env:
          TGID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOTID: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KT_LINK: https://github.com/AzyrRuthless/kernel_xiaomi_sm6250
          KT_BRANCH: 15
        run: |
          bash KinesisZ.sh

      - name: 📂 List files for debugging
        run: ls -l

      - name: 📤 Upload Kernel Zip to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kinesis-Kernel-Release-Artifact
          path: ${{ env.ZIPNAME }}
        if: always()

      - name: 🎉 Create Release
        id: create_release
        uses: actions/create-release@v1
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Kinesis-Kernel-Release-${{ github.run_number }}
          release_name: Kinesis Kernel Release ${{ github.run_number }}
          draft: false
          prerelease: false
          body: |
            **Kinesis Kernel Release ${{ github.run_number }}**

            - **Compiler:** ZyCromerZ Clang 20.0.0
            - **Device:** SM6250
            - **Build Date:** $(date '+%Y-%m-%d %H:%M')

            **Note:** This release is automatically generated by GitHub Actions.

      - name: 🚀 Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ZIPNAME }}
          asset_name: ${{ env.ZIPNAME }}
          asset_content_type: application/zip

      - name: 📝 Update Release with Build Details
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/tags/Kinesis-Kernel-Release-${{ github.run_number }} | jq .id)
          ZIP_URL=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ steps.upload-release-asset.outputs.asset_id }} | jq -r .browser_download_url)
          BUILD_TIME_MINUTES=$((SECONDS / 60))
          BUILD_TIME_SECONDS=$((SECONDS % 60))
          sed -i "/- \*\*Build Date:\*\* $(date '+%Y-%m-%d %H:%M')/a \\
          - **Built by:** ${{ env.KBUILD_BUILD_USER }} \\
          - **Build Host:** ${{ env.KBUILD_BUILD_HOST }} \\
          - **Build Time:** ${BUILD_TIME_MINUTES} minute(s) and ${BUILD_TIME_SECONDS} second(s) \\
          - **Commit:** $(git rev-parse --short HEAD) \\
          \\
          **Download:** $ZIP_URL" ${{ github.event.repository.releases_url }}/${RELEASE_ID}

      - name: 🚀 Update Telegram Release Message with URL
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TGID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOTID: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          ZIP_URL=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ steps.upload-release-asset.outputs.asset_id }} | jq -r .browser_download_url)
          sed -i "s#Download]($ZIP_URL)#[Download]($ZIP_URL)#" KinesisZ.sh
          bash KinesisZ.sh
